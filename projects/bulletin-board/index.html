<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Bulletin Board</title>
        <link href="css/setup.css" rel="stylesheet">
        <link href="css/style.css" rel="stylesheet" data-meal-prep>
    </head>
    <body>
        <div id="bulletin-board" class="grid">
            <div class="post-it yellow">
                <h3>
                    YOU GOT THIS!
                    <img src="images/vecteezy_hand-drawn-thumbs-up-icon-doodle-approval-gesture-illustration_85076261.png" 
                    alt="thumbs up" width="120">
                </h3>
            </div>
            <div class="post-it purple">
                <h3>Reminder: Project due at 3 pm!</h3>
                <p><i>Gotta get that grade up dummy!</i></p>
            </div>
            <div class="post-it orange">
                <img src="images/vecteezy_stenciled-short-hair-girl-avatar_81826984.png"
                width="170" alt="short hair girl">
            </div>
            <div class="post-it cyan">
                <h2>
                    Grocery List!
                    <hr>
                </h2>
                <ul>
                    <li>Eggs</li>
                    <li>bacon</li>
                    <li>chicken</li>
                    <li>rice</li>
                    <li>milk</li>
                </ul>
            </div>
            <div class="post-it red">
                <p>
                    <b>“You are not alone, and you are better than you think.”
                    </b> 
                </p>
                <br>
                <img src="images/vecteezy_emoji-feedback-rating-customers-review-clip-art_21976407.png" 
                alt="smile emoji" width="50" class="image">
            </div>
            <div class="post-it green">
                *<b>HANG OUT TODAY WITH FRIENDS!</b>*
                <ul>
                    <li><b>BRING SNACKS</b></li>
                </ul>
                <b> >:] </b>
            </div>
        </div>
    </body>
</html>
